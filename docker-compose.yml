services:
  herculito-push-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: herculito-push-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DATABASE_PATH: ${DATABASE_PATH:-/data/push.sqlite}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
    volumes:
      - /var/lib/herculito/data:/data
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const port = process.env.PORT ?? '3000'; fetch('http://localhost:' + port + '/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - proxy
    labels:
      - traefik.enable=true

      - traefik.http.routers.herculito-push-api.rule=Host(`api.herculito.exloz.site`)
      - traefik.http.routers.herculito-push-api.entrypoints=websecure
      - traefik.http.routers.herculito-push-api.tls=true
      - traefik.http.routers.herculito-push-api.tls.certresolver=letsencrypt

      - traefik.http.routers.herculito-push-api-http.rule=Host(`api.herculito.exloz.site`)
      - traefik.http.routers.herculito-push-api-http.entrypoints=web
      - traefik.http.routers.herculito-push-api-http.middlewares=herculito-push-api-https-redirect
      - traefik.http.middlewares.herculito-push-api-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.herculito-push-api-https-redirect.redirectscheme.permanent=true

      - traefik.http.services.herculito-push-api.loadbalancer.server.port=3000

      - traefik.docker.network=proxy

networks:
  proxy:
    external: true
