services:
  herculito-push-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DATABASE_PATH: ${DATABASE_PATH:-/data/push.sqlite}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      CLERK_ISSUER: ${CLERK_ISSUER}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      CLERK_AUDIENCE: ${CLERK_AUDIENCE:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
    volumes:
      - /var/lib/herculito/data:/data:Z
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const port = process.env.PORT ?? '3000'; fetch('http://localhost:' + port + '/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - proxy
    labels:
      # Dokploy injects routers/services automatically, but Traefik still needs the shared network.
      - traefik.docker.network=proxy

networks:
  proxy:
    external: true
